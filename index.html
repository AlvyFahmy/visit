<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frozen Visit Dashboard - Split View</title>
    
    <!-- Core Engine Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #4f46e5; 
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            
            /* Alert Colors */
            --alert-danger-bg: #fee2e2;
            --alert-danger-txt: #991b1b;
            --alert-success-bg: #dcfce7;
            --alert-success-txt: #166534;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-main); color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            height: 100vh; overflow: hidden;
        }
        
        /* Master Split Screen Layout */
        .dashboard-wrapper { display: flex; width: 100vw; height: 100vh; }

        /* Left Sidebar: Filters & Management */
        .sidebar { 
            width: 320px; min-width: 320px; background: var(--bg-card);
            border-right: 1px solid var(--border); padding: 24px;
            display: flex; flex-direction: column; gap: 24px;
            overflow-y: auto; box-shadow: 2px 0 8px rgba(0,0,0,0.02);
        }
        .sidebar-title { font-size: 16px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; margin: 0 0 4px 0; }
        
        .main-tabs { display: flex; background: #f1f5f9; padding: 4px; border-radius: 12px; gap: 4px; }
        .tab-btn { 
            flex: 1; border: none; padding: 10px 0; border-radius: 10px; font-weight: 700; 
            cursor: pointer; color: var(--text-muted); background: transparent; transition: all 0.2s; font-size: 12px;
        }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: var(--shadow-sm); }

        .filter-group { display: flex; flex-direction: column; gap: 8px; }
        .filter-group label { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }
        .filter-group select { 
            padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); 
            font-size: 13px; font-weight: 600; background: #ffffff; color: var(--text-main); cursor: pointer; width: 100%;
        }
        .filter-group select:focus { border-color: var(--primary); outline: none; }
        
        .btn-refresh {
            padding: 12px; cursor: pointer; font-weight: 700; background: rgba(79, 70, 229, 0.06); 
            border: 1px solid rgba(79, 70, 229, 0.15); border-radius: 10px; color: var(--primary); width: 100%; font-size: 13px;
            transition: all 0.2s;
        }
        .btn-refresh:hover { background: var(--primary); color: white; }

        .sync-indicator { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border); }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; }
        .dot-syncing { background-color: #f59e0b; animation: pulse 1s infinite; }
        .dot-online { background-color: #10b981; }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        /* Right Panel: Content Viewport (Full Screen Data) */
        .main-content { flex-grow: 1; height: 100%; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }

        /* KPI Block Matrix */
        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .kpi-card { 
            background: var(--bg-card); border: 1px solid var(--border); padding: 16px 20px; border-radius: 14px;
            box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 4px;
        }
        .kpi-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .kpi-value { font-size: 22px; font-weight: 800; }

        /* Charts Architecture Layout */
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .chart-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 16px; box-shadow: var(--shadow-sm); height: 260px; }

        /* Hierarchical Matrix Table */
        .table-section { display: flex; flex-direction: column; gap: 12px; }
        .table-wrapper { border: 1px solid var(--border); border-radius: 16px; overflow-x: auto; background: var(--bg-card); box-shadow: var(--shadow-sm); }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 2200px; table-layout: fixed; }
        th, td { border: 1px solid #f1f5f9; padding: 12px 6px; text-align: center; }
        th { font-weight: 700; font-size: 11px; }
        
        .col-lokasi { 
            width: 280px; position: sticky; left: 0; z-index: 20; background: #ffffff; 
            text-align: left !important; padding-left: 20px !important; border-right: 2px solid #e2e8f0 !important; 
            font-weight: 600; cursor: pointer;
        }
        
        tr:hover .col-lokasi { background: #f8fafc !important; }
        tr:hover { background: #f8fafc; }
        
        /* Table Row Hierarchy Styling */
        .row-national { background: #e0e7ff !important; font-weight: 800; color: #3730a3; border-bottom: 2px solid #c7d2fe; }
        .row-region { background: rgba(79, 70, 229, 0.02) !important; font-weight: 700; color: var(--primary); }
        .row-branch { background: #fafafa !important; font-weight: 600; }
        .row-city { color: var(--text-muted); }
        
        .hidden { display: none; }
        .cell-alert-danger { background-color: var(--alert-danger-bg) !important; color: var(--alert-danger-txt) !important; font-weight: 700; border-radius: 4px; }
        .cell-alert-success { background-color: var(--alert-success-bg) !important; color: var(--alert-success-txt) !important; font-weight: 700; border-radius: 4px; }
    </style>
</head>
<body>

<div class="dashboard-wrapper">
    <!-- LEFT SIDEBAR: CONTROL PANEL FILTERS -->
    <aside class="sidebar">
        <div>
            <h2 class="sidebar-title">FROZEN FLOW TO VISIT</h2>
            <p style="font-size: 12px; color: var(--text-muted); margin: 0 0 16px 0;">Sales & SDV Macro Monitoring</p>
            <div class="main-tabs">
                <button class="tab-btn active" id="tabSales" onclick="switchMode('SALES')">SALES</button>
                <button class="tab-btn" id="tabSdv" onclick="switchMode('SDV')">SDV</button>
            </div>
        </div>

        <div class="filter-group">
            <label>Region Filter</label>
            <select id="selRegion"><option value="ALL">All Regions</option></select>
        </div>

        <div class="filter-group">
            <label>Branch Focus</label>
            <select id="selBranch"><option value="ALL">All Branches</option></select>
        </div>

        <div class="filter-group">
            <label>Time Frame</label>
            <select id="selPeriod"><option value="ALL">All Period</option></select>
        </div>

        <div class="filter-group">
            <label>Metric Basis</label>
            <select id="selMode" onchange="updateViewMode(this.value)">
                <option value="pct">Percentage Ratio (%)</option>
                <option value="abs">Absolute Unit (#)</option>
            </select>
        </div>

        <button class="btn-refresh" onclick="fetchData()">🔄 Force Sync Pipeline</button>

        <div class="sync-indicator">
            <span class="dot dot-syncing"></span>
            <span id="syncText">Mempersiapkan pipeline...</span>
        </div>
    </aside>

    <!-- RIGHT PANEL: FULL SCREEN ANALYTICS CONTENT -->
    <main class="main-content">
        <!-- Top Macro Status Cards -->
        <section class="kpi-grid">
            <div class="kpi-card" style="border-left: 4px solid var(--primary);">
                <span class="kpi-title">Total Population Managed</span>
                <span class="kpi-value" id="kpiTotal">-</span>
            </div>
            <div class="kpi-card" style="border-left: 4px solid #10b981;">
                <span class="kpi-title">🏆 Top Active Branch</span>
                <span class="kpi-value" id="kpiTopBranch" style="font-size: 15px; color:#166534; font-weight:700; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">-</span>
            </div>
            <div class="kpi-card" style="border-left: 4px solid #ef4444;">
                <span class="kpi-title">⚠️ Critical Churn Risk</span>
                <span class="kpi-value" id="kpiBadBranch" style="font-size: 15px; color:#991b1b; font-weight:700; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">-</span>
            </div>
        </section>

        <!-- National Trend & Population Charts Workplace -->
        <section class="charts-grid">
            <!-- Left: National Population Volume Data Awal -->
            <div class="chart-card">
                <canvas id="populationChart"></canvas>
            </div>
            <!-- Right: National Conversion Status Trends -->
            <div class="chart-card">
                <canvas id="trendChart"></canvas>
            </div>
        </section>

        <!-- Deep-Dive Matrix Data Structure -->
        <section class="table-section">
            
            
            <div class="table-wrapper">
                <table id="mainTable">
                    <thead>
                        <tr id="headMonth"><th rowspan="2" class="col-lokasi" style="background: #f8fafc; color: var(--text-main);">ORGANIZATIONAL HIERARCHY</th></tr>
                        <tr id="headStatus"></tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="25" style="padding: 60px; color: var(--text-muted); font-size: 13px;">Waiting for data connection orchestration...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script>
    let allData = { SALES: [], SDV: [] };
    let currentMode = 'SALES';
    let viewMode = 'pct';
    let charts = { trend: null, population: null };
    const monthsName = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const GITHUB_URL = "https://raw.githubusercontent.com/AlvyFahmy/visit/main/inventory_sales-sdv.xlsx";

    const hMonth = document.getElementById('headMonth');
    const hStatus = document.getElementById('headStatus');
    monthsName.forEach(m => {
        hMonth.innerHTML += `<th colspan="2" style="background: #f8fafc; color: var(--text-main); border-bottom: 1px solid var(--border); font-size:11px;">${m.toUpperCase()}</th>`;
        hStatus.innerHTML += `<th style="background: #ffffff; color: var(--text-muted); font-size: 10px; font-weight:700;">ACT</th><th style="background: #ffffff; color: var(--text-muted); font-size: 10px; font-weight:700;">CHR</th>`;
    });

    window.onload = () => { fetchData(); };

    async function fetchData() {
        const statusDot = document.querySelector('.dot');
        const statusText = document.getElementById('syncText');
        statusDot.className = 'dot dot-syncing';

        try {
            const response = await fetch(GITHUB_URL + '?t=' + new Date().getTime());
            if (!response.ok) throw new Error("Network Pipeline Error");
            
            const arrayBuffer = await response.arrayBuffer();
            const data = new Uint8Array(arrayBuffer);
            const wb = XLSX.read(data, {type: 'array'});
            
            let found = false;
            ['SALES', 'SDV'].forEach(sheet => {
                if(wb.Sheets[sheet]) {
                    const json = XLSX.utils.sheet_to_json(wb.Sheets[sheet]);
                    allData[sheet] = json.map(row => ({
                        region: String(row["REGION"] || "N/A").trim(),
                        branch: String(row["BRANCH"] || "N/A").trim(),
                        city: String(row["CITY"] || "N/A").trim(),
                        status: String(row["Current Customer Status"] || "").trim().toLowerCase(),
                        monthIdx: monthsName.indexOf(String(row["Periode Frozen"] || "").trim())
                    })).filter(i => i.monthIdx !== -1);
                    found = true;
                }
            });

            if(!found) throw new Error("Excel Schema Invalid");

            statusDot.className = 'dot dot-online';
            statusText.innerText = 'Last update 7 Agustus 2026';
            
            populateDropdowns();
            renderAll();
        } catch (err) {
            statusDot.className = 'dot dot-offline';
            statusText.innerText = 'Sync Error: ' + err.message;
        }
    }

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('tabSales').classList.toggle('active', mode === 'SALES');
        document.getElementById('tabSdv').classList.toggle('active', mode === 'SDV');
        populateDropdowns();
        renderAll();
    }

    function populateDropdowns() {
    const data = allData[currentMode];
    const regSel = document.getElementById('selRegion');
    const perSel = document.getElementById('selPeriod'); // Ambil target dropdown Periode
    
    // 1. Populasi Dropdown Region
    const regions = [...new Set(data.map(d => d.region))].sort();
    regSel.innerHTML = '<option value="ALL">All Regions</option>';
    regions.forEach(r => regSel.add(new Option(r, r)));

    // 2. Populasi Dropdown Periode (Jan - Dec secara Otomatis)
    perSel.innerHTML = '<option value="ALL">All Period</option>';
    monthsName.forEach((m, idx) => {
        // m = Nama Bulan (JAN, FEB, dll), idx = Angka Index Bulan (0 untuk Jan, 1 untuk Feb, dst)
        perSel.add(new Option(m.toUpperCase(), idx));
    });

    // 3. Set Event Listener saat filter diubah
    regSel.onchange = () => { updateBranchDropdown(); renderAll(); };
    document.getElementById('selBranch').onchange = renderAll;
    perSel.onchange = renderAll; // Jalankan render ulang saat bulan dipilih
    
    updateBranchDropdown();
}

    function updateBranchDropdown() {
        const data = allData[currentMode];
        const reg = document.getElementById('selRegion').value;
        const brSel = document.getElementById('selBranch');
        const filtered = reg === "ALL" ? data : data.filter(d => d.region === reg);
        const branches = [...new Set(filtered.map(d => d.branch))].sort();
        brSel.innerHTML = '<option value="ALL">All Branches</option>';
        branches.forEach(b => brSel.add(new Option(b, b)));
    }

    function updateViewMode(mode) { viewMode = mode; renderAll(); }

    function renderAll() {
        const fReg = document.getElementById('selRegion').value;
        const fBr = document.getElementById('selBranch').value;
        const fPer = document.getElementById('selPeriod').value;

        const filtered = allData[currentMode].filter(d => {
            const matchReg = fReg === "ALL" || d.region === fReg;
            const matchBr = fBr === "ALL" || d.branch === fBr;
            const matchPer = fPer === "ALL" || d.monthIdx == fPer;
            return matchReg && matchBr && matchPer;
        });

        calculateExecutiveInsights(filtered);
        updateChartsAndGraphs(allData[currentMode]); // Grafis tren makro selalu membaca data dasar menyeluruh nasional
        updateMatrix(allData[currentMode], filtered);
    }

    function calculateExecutiveInsights(data) {
        document.getElementById('kpiTotal').innerText = data.length.toLocaleString('id-ID');
        
        const branchPerf = {};
        data.forEach(d => {
            if(!branchPerf[d.branch]) branchPerf[d.branch] = { total: 0, active: 0, churn: 0 };
            branchPerf[d.branch].total++;
            if(d.status === 'active') branchPerf[d.branch].active++;
            if(d.status === 'churn') branchPerf[d.branch].churn++;
        });

        let topBranch = "-", badBranch = "-";
        let maxActivePct = -1, maxChurnPct = -1;

        Object.keys(branchPerf).forEach(br => {
            const b = branchPerf[br];
            if(b.total > 5) {
                const actPct = (b.active / b.total) * 100;
                const chrPct = (b.churn / b.total) * 100;

                if(actPct > maxActivePct) { maxActivePct = actPct; topBranch = br; }
                if(chrPct > maxChurnPct) { maxChurnPct = chrPct; badBranch = br; }
            }
        });

        document.getElementById('kpiTopBranch').innerText = maxActivePct !== -1 ? `${topBranch} (${Math.round(maxActivePct)}%)` : '-';
        document.getElementById('kpiBadBranch').innerText = maxChurnPct !== -1 ? `${badBranch} (${Math.round(maxChurnPct)}%)` : '-';
    }

    function updateChartsAndGraphs(masterData) {
        const nationalStats = Array.from({length: 12}, () => ({ a: 0, c: 0, t: 0 }));
        masterData.forEach(d => {
            nationalStats[d.monthIdx].t++;
            if (d.status === 'active') nationalStats[d.monthIdx].a++;
            if (d.status === 'churn') nationalStats[d.monthIdx].c++;
        });

        if (charts.trend) charts.trend.destroy();
        if (charts.population) charts.population.destroy();

        // 1. GRAFIK POPULASI DATA AWAL (BAR CHART)
        const ctxPop = document.getElementById('populationChart').getContext('2d');
        charts.population = new Chart(ctxPop, {
            type: 'bar',
            data: {
                labels: monthsName,
                datasets: [{
                    data: nationalStats.map(s => s.t),
                    backgroundColor: 'rgba(79, 70, 229, 0.85)',
                    borderRadius: 4
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    title: { display: true, text: 'NATIONAL INITIAL POPULATION VOLUME (PER MONTH)', font: { size: 11, weight: 'bold', family: 'Plus Jakarta Sans' }, color: '#64748b', align: 'start' }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { font: { size: 9 }, color: '#64748b' } },
                    y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 9 }, color: '#64748b' } }
                }
            }
        });

        // 2. GRAFIK CONVERSION STATUS RATIO (LINE CHART)
        const ctxTrend = document.getElementById('trendChart').getContext('2d');
        charts.trend = new Chart(ctxTrend, {
            type: 'line',
            data: {
                labels: monthsName,
                datasets: [
                    { label: 'Active %', data: nationalStats.map(s => s.t ? (s.a / s.t * 100).toFixed(1) : 0), borderColor: '#10b981', backgroundColor: 'transparent', tension: 0.3, borderWidth: 2.5, pointRadius: 1 },
                    { label: 'Churn %', data: nationalStats.map(s => s.t ? (s.c / s.t * 100).toFixed(1) : 0), borderColor: '#ef4444', backgroundColor: 'transparent', tension: 0.3, borderWidth: 2.5, pointRadius: 1 }
                ]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { 
                    legend: { position: 'top', labels: { font: { weight: 600, size: 9 }, boxWidth: 10 } },
                    title: { display: true, text: 'NATIONAL CONVERSION STATUS RATIO TREN (%)', font: { size: 11, weight: 'bold' }, color: '#64748b', align: 'start' }
                },
                scales: {
                    y: { max: 100, min: 0, grid: { color: '#f1f5f9' }, ticks: { font: { size: 9 }, color: '#64748b' } },
                    x: { grid: { display: false }, ticks: { font: { size: 9 }, color: '#64748b' } }
                }
            }
        });
    }

    function updateMatrix(masterData, filteredData) {
        const nationalStats = Array.from({length: 12}, () => ({ a: 0, c: 0, t: 0 }));
        masterData.forEach(d => {
            nationalStats[d.monthIdx].t++;
            if (d.status === 'active') nationalStats[d.monthIdx].a++;
            if (d.status === 'churn') nationalStats[d.monthIdx].c++;
        });

        const tree = {};
        filteredData.forEach(d => {
            if(!tree[d.region]) tree[d.region] = { total: Array.from({length:12},()=>({a:0,c:0,t:0})), branches: {} };
            if(!tree[d.region].branches[d.branch]) tree[d.region].branches[d.branch] = { total: Array.from({length:12},()=>({a:0,c:0,t:0})), cities: {} };
            if(!tree[d.region].branches[d.branch].cities[d.city]) tree[d.region].branches[d.branch].cities[d.city] = Array.from({length:12},()=>({a:0,c:0,t:0}));

            const rN = tree[d.region].total[d.monthIdx], bN = tree[d.region].branches[d.branch].total[d.monthIdx], cN = tree[d.region].branches[d.branch].cities[d.city][d.monthIdx];
            if(d.status === 'active') { rN.a++; bN.a++; cN.a++; }
            if(d.status === 'churn') { rN.c++; bN.c++; cN.c++; }
            rN.t++; bN.t++; cN.t++;
        });

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        // Baris Utama Skala Nasional (Grand Total)
        tbody.appendChild(createRow('🇮🇩 GRAND TOTAL (NASIONAL)', nationalStats, 'row-national', null, ''));

        // Penguraian Lapisan Hierarki
        Object.keys(tree).sort().forEach((reg, rIdx) => {
            tbody.appendChild(createRow(reg, tree[reg].total, 'row-region', `toggleRow('reg-${rIdx}')`, '🌍'));
            Object.keys(tree[reg].branches).sort().forEach((br, bIdx) => {
                tbody.appendChild(createRow(br, tree[reg].branches[br].total, `row-branch reg-${rIdx} hidden`, `toggleRow('br-${rIdx}-${bIdx}')`, '🏢', 35));
                Object.keys(tree[reg].branches[br].cities).sort().forEach(ct => {
                    tbody.appendChild(createRow(ct, tree[reg].branches[br].cities[ct], `row-city reg-${rIdx} br-${rIdx}-${bIdx} hidden`, null, '📍', 60));
                });
            });
        });
    }

    function createRow(name, dataArr, className, clickFn, icon, indent = 20) {
        const tr = document.createElement('tr');
        tr.className = className;
        if(clickFn) tr.setAttribute('onclick', clickFn);
        
        let html = `<td class="col-lokasi" style="padding-left:${indent}px !important; ${className.includes('row-national') ? 'background:#e0e7ff !important;' : ''}">${icon} &nbsp;${name}</td>`;
        
        dataArr.forEach(v => {
            let a = v.a, c = v.c;
            let aClass = '', cClass = '';
            
            if (v.t > 0) {
                const actRatio = (v.a / v.t) * 100;
                const chrRatio = (v.c / v.t) * 100;
                
                if (!className.includes('row-national')) {
                    if (actRatio >= 85) aClass = 'class="cell-alert-success"'; 
                    if (chrRatio >= 15) cClass = 'class="cell-alert-danger"';
                }

                if(viewMode === 'pct') {
                    a = Math.round(actRatio) + '%';
                    c = Math.round(chrRatio) + '%';
                } else {
                    a = a.toLocaleString('id-ID');
                    c = c.toLocaleString('id-ID');
                }
            } else {
                a = '-'; c = '-';
            }
            
            html += `<td ${aClass}>${a}</td><td ${cClass}>${c}</td>`;
        });
        
        tr.innerHTML = html;
        return tr;
    }

    function toggleRow(cls) {
        document.querySelectorAll(`.${cls}`).forEach(r => {
            r.classList.toggle('hidden');
            if (r.classList.contains('hidden')) {
                const subCls = r.className.split(' ').find(c => c.startsWith('br-'));
                if(subCls) document.querySelectorAll(`.${subCls}`).forEach(sr => sr.classList.add('hidden'));
            }
        });
    }
</script>
</body>
</html>
